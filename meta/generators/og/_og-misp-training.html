<!DOCTYPE html>
<html lang="en">
<head>
<!-- github-pages-preview-only --><meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@500;700&display=swap" rel="stylesheet">
<!--
  ============================================================================
  OG CARD  ·  capabilities/misp-training
  ----------------------------------------------------------------------------
  A sibling of _og.html (the CTI-CMM card), same skeleton: dark ground, offset
  glow, wordmark top-left, headline + sub, url bottom-left, and one motif owning
  the right of the canvas.

  Two departures, both inherited from the page itself:
    · The glow is RED, not CTI Blue — rgba(229,56,52,…) verbatim from
      capabilities/misp-training.html:316-317. That page is the red instance of
      the Capability family.
    · The motif is the terminal prompt, not a ladder. It is the Lab chip's own
      icon (Lucide terminal) at card scale, because what this page sells is
      hands-on lab work and "basic familiarity with the command line" is its
      one stated prerequisite.

  Render: node meta/generators/og/render-card.mjs
  Not driven by generate.mjs — that script scrapes live blog posts and has no
  path for a static page card.
  ============================================================================
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0e141c; }
  .og {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Manrope', sans-serif;
    background: #0e141c;                 /* Color/Dark */
  }
  /* The hero's two offset washes, verbatim from the page. */
  .og__glow {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(ellipse at 22% 40%, rgba(229,56,52,0.13) 0%, transparent 58%),
      radial-gradient(ellipse at 78% 88%, rgba(229,56,52,0.07) 0%, transparent 52%);
  }
  .og__logo {
    position: absolute;
    left: 80px;
    top: 64px;
    width: 274px;
    height: auto;
  }
  .og__content {
    position: absolute;
    left: 80px;
    right: 470px;                        /* the motif owns the right edge */
    top: 172px;
  }
  .og__title {
    color: #ffffff;
    font-size: 66px;
    font-weight: 700;
    line-height: 1.12;
    letter-spacing: -1px;
  }
  .og__sub {
    margin-top: 26px;
    color: rgba(255,255,255,0.72);
    font-size: 30px;
    font-weight: 500;
    line-height: 1.35;
  }
  .og__url {
    position: absolute;
    left: 80px;
    bottom: 66px;
    color: #ffffff;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  /* ── The motif: the Lab chip, blown up ──
     Same construction as .trn-syllabus__lab on the page — light fill, dark
     label, Font/Mono — so the card and the syllabus read as one system. The
     prompt above it is Lucide terminal, the chip's own icon. */
  .og__motif {
    position: absolute;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }
  .og__prompt {
    width: 244px;
    height: 244px;
    fill: none;
    stroke: #f4645f;                     /* --page-accent, the on-dark red */
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .og__chip {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: 'Geist Mono', monospace;
    font-size: 27px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    text-indent: 0.08em;
    color: #0e141c;
    background: #2ab6f6;                 /* Color/Blue — the page's one semantic hue */
    border-radius: 8px;
    padding: 9px 20px;
  }
  .og__chip svg {
    width: 27px;
    height: 27px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
</head>
<body>
  <div class="og">
    <div class="og__glow"></div>
    <img class="og__logo" src="../../../logos/cosive_logo_reverse_full_color_transparent_print.png" alt="Cosive">

    <div class="og__content">
      <div class="og__title">Practical MISP training for CTI and SOC teams</div>
      <!-- Hard break: at this column width the sub otherwise wraps mid-compound,
           hyphenating "real-world" across two lines. -->
      <div class="og__sub">Two half-days, live online.<br>Labs built on real-world use cases.</div>
    </div>

    <div class="og__motif">
      <svg class="og__prompt" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m4 17 6-6-6-6"></path>
        <path d="M12 19h8"></path>
      </svg>
      <span class="og__chip">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 17 6-6-6-6"></path><path d="M12 19h8"></path></svg>
        Lab
      </span>
    </div>

    <div class="og__url">cosive.com</div>
  </div>
</body>
</html>
