<style>
  html { scroll-behavior: smooth; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --color-dark: #0e141c;
    --color-white: #ffffff;
    --color-background: #ffffff;
    --color-light-grey: #f8f9fa;
    --color-border: #e8eaed;
    --color-text-primary: #1a1a1a;
    --color-text-secondary: #5f6368;
    --color-accent: #e53834;
    --color-accent-dark: #c1121f;
    --color-mid-grey: #f0f0f0;
    --font-heading: 'Manrope', sans-serif;
    --font-body: 'Manrope', sans-serif;

    /* ── Sizing Tokens ── */

    /* Spacing (4px base grid) */
    --space-2xs: 0.25rem;   /* 4px */
    --space-xs: 0.5rem;     /* 8px */
    --space-sm: 0.75rem;    /* 12px */
    --space-md: 1rem;       /* 16px */
    --space-lg: 1.5rem;     /* 24px */
    --space-xl: 2rem;       /* 32px */
    --space-2xl: 2.5rem;    /* 40px */
    --space-3xl: 3rem;      /* 48px */
    --space-4xl: 4rem;      /* 64px */
    --space-5xl: 5rem;      /* 80px */
    --space-6xl: 6rem;      /* 96px */
    --space-7xl: 8rem;      /* 128px */
    --space-8xl: 10rem;     /* 160px */

    /* Font sizes */
    --text-xs: 0.75rem;     /* 12px */
    --text-sm: 0.875rem;    /* 14px */
    --text-base: 1rem;      /* 16px */
    --text-lg: 1.125rem;    /* 18px */
    --text-xl: 1.25rem;     /* 20px */
    --text-2xl: 1.5rem;     /* 24px */
    --text-3xl: 1.75rem;    /* 28px */
    --text-4xl: 2rem;       /* 32px */
    --text-5xl: 2.5rem;     /* 40px */
    --text-6xl: 3rem;       /* 48px */

    /* Line height */
    --leading-tight: 1.1;
    --leading-snug: 1.3;
    --leading-normal: 1.55;
    --leading-loose: 1.75;

    /* Letter spacing */
    --tracking-tight: -0.02em;
    --tracking-normal: 0;
    --tracking-wide: 0.08em;

    /* Border radius */
    --radius-none: 0;
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --radius-full: 9999px;

    /* Container widths */
    --container-narrow: 640px;
    --container-standard: 768px;
    --container-page: 1400px;
  }

  /* ── Heading Style System ── */
  .heading-style-h1 {
    font-family: var(--font-heading);
    font-size: var(--text-5xl);
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.3px;
    color: var(--color-text-primary);
  }
  .heading-style-h2 {
    font-family: var(--font-heading);
    font-size: var(--text-4xl);
    font-weight: 700;
    line-height: var(--leading-snug);
    color: var(--color-text-primary);
  }
  .heading-style-h3 {
    font-family: var(--font-heading);
    font-size: var(--text-2xl);
    font-weight: 700;
    line-height: var(--leading-snug);
    color: var(--color-text-primary);
  }
  .heading-style-h4 {
    font-family: var(--font-heading);
    font-size: var(--text-xl);
    font-weight: 600;
    line-height: 1.4;
    color: var(--color-text-primary);
  }

  body {
    font-family: var(--font-body);
    color: var(--color-text-primary);
    line-height: var(--leading-normal);
    -webkit-font-smoothing: antialiased;
    background: var(--color-background);
  }

  a { text-decoration: none; color: inherit; }
  ul { list-style: none; }

  .container {
    max-width: 100%;
    margin: 0 auto;
    padding: 0 var(--space-3xl);
  }

  /* ── Header ── */
  .site-header {
    background: var(--color-white);
    border-bottom: 1px solid var(--color-border);
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: var(--space-5xl);
  }

  .header-logo img {
    height: var(--space-xl);
  }

  .main-nav ul {
    display: flex;
    gap: var(--space-xs);
    align-items: center;
  }

  .main-nav a {
    color: var(--color-text-secondary);
    font-size: var(--text-base);
    font-weight: 500;
    padding: var(--space-xs) var(--space-md);
    border-radius: var(--radius-sm);
    transition: color 0.2s;
  }

  .main-nav a:hover {
    color: var(--color-text-primary);
  }

  .nav-cta {
    background: var(--color-accent) !important;
    color: var(--color-white) !important;
    border: none !important;
    padding: var(--space-xs) var(--space-lg) !important;
    border-radius: var(--radius-sm) !important;
    font-weight: 600 !important;
    transition: background 0.2s !important;
    white-space: nowrap;
  }

  .nav-cta:hover {
    background: var(--color-accent-dark) !important;
  }

  /* Hamburger toggle (hidden on desktop) */
  .nav-toggle {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    padding: var(--space-xs);
    color: var(--color-text-primary);
  }

  .nav-toggle svg {
    width: var(--space-lg);
    height: var(--space-lg);
    display: block;
  }

  /* ── Page Banner ── */
  .page-banner {
    position: relative;
    overflow: hidden;
    background: #121212;
  }

  .page-banner > img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 100%;
    filter: grayscale(0.4);
    opacity: 0.45;
  }

  .page-banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(14, 20, 28, 0.4);
    z-index: 1;
  }

  .page-banner-inner {
    position: relative;
    z-index: 2;
    padding: var(--space-3xl) 0 var(--space-3xl);
  }

  .page-banner .breadcrumb {
    display: flex;
    align-items: center;
    gap: var(--space-xs);
    margin-bottom: var(--space-sm);
    font-family: var(--font-body);
    font-size: var(--text-base);
  }

  .page-banner .breadcrumb a {
    color: var(--color-border);
    transition: color 0.2s;
  }

  .page-banner .breadcrumb a:hover {
    color: var(--color-white);
  }

  .page-banner .breadcrumb .breadcrumb-home {
    display: inline-flex;
    align-items: center;
    gap: 0.3em;
  }

  .page-banner .breadcrumb .separator {
    color: var(--color-border);
  }

  .page-banner .breadcrumb .current {
    color: var(--color-white);
    font-weight: 600;
  }

  .page-banner h1 {
    font-family: var(--font-heading);
    font-size: var(--text-6xl);
    font-weight: 700;
    color: var(--color-white);
    letter-spacing: var(--tracking-tight);
    line-height: var(--leading-snug);
  }

  /* ── Light Footer ──
     _footer.html carries markup only (unlike _header.html, which ships its own
     <style>), so every page has to supply these rules. Copied verbatim from the
     pillar pages. Without them the footer logo has no height cap and blows the
     page out to ~5900px wide. */
  .site-footer {
    border-top: 1px solid var(--color-border);
    padding: var(--space-5xl) 0 var(--space-3xl);
  }

  .footer-inner {
    display: flex;
    flex-direction: column;
    gap: var(--space-4xl);
  }

  /* Sitemap columns */
  .footer-columns {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: var(--space-4xl) var(--space-2xl);
  }

  .footer-col { flex: 0 0 auto; }

  .footer-col-title {
    font-family: var(--font-heading);
    font-size: var(--text-xs);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: var(--tracking-wide);
    color: var(--color-text-primary);
    margin-bottom: var(--space-md);
  }

  .footer-col-title a { color: inherit; transition: color 0.2s; }
  .footer-col-title a:hover { color: var(--color-accent); }

  .footer-col ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
  }

  .footer-col li a {
    font-size: var(--text-sm);
    color: var(--color-text-secondary);
    line-height: var(--leading-snug);
    transition: color 0.2s;
  }

  .footer-col li a:hover { color: var(--color-accent); }

  /* Bottom bar: logo left · copyright right */
  .footer-bottom {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-md);
  }

  .footer-bottom .footer-logo img { height: var(--space-xl); }

  .footer-bottom-links { display: flex; align-items: center; gap: var(--space-lg); }

  .footer-bottom-links a {
    font-size: var(--text-base);
    color: var(--color-text-primary);
    font-weight: 500;
    transition: color 0.2s;
  }

  .footer-bottom-links a:hover { color: var(--color-accent); }

  .footer-copyright {
    font-size: var(--text-xs);
    color: var(--color-text-primary);
    text-align: right;
  }

  /* ── Responsive ── */

  /* Footer: fit-content flex row only holds all 7 columns above ~1400px */
  @media (max-width: 1400px) {
    .footer-columns { display: grid; grid-template-columns: repeat(4, 1fr); }
  }

  @media (max-width: 900px) {
    .container { padding: 0 var(--space-lg); }

    /* Header nav — accordion on tablet/mobile */
    .nav-toggle { display: block; }
    .main-nav { display: none; width: 100%; }
    .main-nav.open { display: block; }
    .main-nav ul { flex-direction: column; gap: 0; width: 100%; }
    .main-nav li + li { border-top: 1px solid var(--color-border); }
    .main-nav li:last-child { border-top: none; }
    .main-nav a { display: block; font-size: var(--text-base); padding: var(--space-md) 0; border-radius: var(--radius-none); }
    .header-inner { flex-wrap: wrap; height: auto; padding: var(--space-md) var(--space-lg); }

    /* Heading system */
    .heading-style-h1 { font-size: 1.8rem; }
    .heading-style-h2 { font-size: var(--text-2xl); }

    /* Page banner */
    .page-banner h1 { font-size: var(--text-4xl); }
  }

  @media (max-width: 600px) {
    /* Heading system */
    .heading-style-h1 { font-size: var(--text-2xl); }
    .heading-style-h2 { font-size: 1.3rem; }

    /* Page banner */
    .page-banner h1 { font-size: var(--text-3xl); }
    .page-banner-inner { padding: var(--space-xl) 0 var(--space-xl); }

    /* Footer */
    .footer-bottom { flex-direction: column; align-items: center; text-align: center; }
    .footer-columns { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>

</div>

<script src="footer-include.js"></script>

</body>
