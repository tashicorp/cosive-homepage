<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 750 240">
  <defs>
    <marker id="a" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#e53834" d="m0 1 9 4-9 4z"/></marker>
    <marker id="b" markerHeight="7" markerWidth="7" orient="auto" refX="1" refY="5" viewBox="0 0 10 10"><path fill="#e53834" d="M10 1 1 5l9 4z"/></marker>
  </defs>

  <!-- ===== LAYER 1: ARROWS ===== -->

  <!-- Analysts <-> CloudMISP (bidirectional, vertical) -->
  <path stroke="#e53834" stroke-width="1.5" marker-start="url(#b)" marker-end="url(#a)" d="M375 51 375 88"/>

  <!-- Okta <-> CloudMISP (bidirectional, horizontal) -->
  <path stroke="#e53834" stroke-width="1.5" marker-start="url(#b)" marker-end="url(#a)" d="M165 116 310 116"/>

  <!-- CloudMISP <-> MISP Community (bidirectional, horizontal) -->
  <path stroke="#e53834" stroke-width="1.5" marker-start="url(#b)" marker-end="url(#a)" d="M440 116 585 116"/>

  <!-- Sentinel <-> CloudMISP (bidirectional, diagonal) -->
  <path stroke="#e53834" stroke-width="1.5" marker-start="url(#b)" marker-end="url(#a)" d="M165 198 310 132"/>

  <!-- Feed -> CloudMISP (one-way, diagonal) -->
  <path stroke="#e53834" stroke-width="1.5" marker-end="url(#a)" d="M585 198 440 132"/>

  <!-- CloudMISP -> Infrastructure (one-way, vertical) -->
  <path stroke="#e53834" stroke-width="1.5" marker-end="url(#a)" d="M375 144 375 180"/>

  <!-- ===== LAYER 2: NODES ===== -->

  <!-- CloudMISP (hub) -->
  <rect width="130" height="56" x="310" y="88" fill="#fef2f2" stroke="#e53834" stroke-width="1.5" rx="8"/>
  <g transform="translate(355,94) scale(0.11290,0.11268)">
    <path d="M3 71c22-65 40-65 62 0s40 65 62 0 40-65 62 0 40 65 62 0 40-65 62 0" fill="none" stroke="#bdbdbd" stroke-width="6.55" stroke-linecap="round"/>
    <path d="M33 71c22-65 40-65 62 0s40 65 62 0 40-65 62 0 40 65 62 0" fill="none" stroke="#e53834" stroke-width="6.55" stroke-linecap="round"/>
  </g>
  <text x="375" y="130" fill="#e53834" font-family="Manrope, sans-serif" font-size="10" font-weight="700" text-anchor="middle">CloudMISP</text>

  <!-- Your Threat Analysts (top centre) -->
  <rect width="110" height="46" x="320" y="5" fill="#eef4fa" stroke="#9aa0a6" stroke-width="1.5" rx="8"/>
  <path stroke="#2d6da3" stroke-linecap="round" stroke-linejoin="round" stroke-width=".9" d="M367.5 14a3.5 3.5 0 1 0 7 0 3.5 3.5 0 1 0-7 0M375.5 14a3.5 3.5 0 1 0 7 0 3.5 3.5 0 1 0-7 0M365.5 21a5.5 4 0 0 1 11 0M373.5 21a5.5 4 0 0 1 11 0"/>
  <text x="375" y="34" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Your Threat</text>
  <text x="375" y="45" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Analysts</text>

  <!-- Okta / Azure Entra ID (middle-left) -->
  <rect width="110" height="46" x="55" y="93" fill="#eef4fa" stroke="#9aa0a6" stroke-width="1.5" rx="8"/>
  <path stroke="#2d6da3" stroke-linecap="round" stroke-linejoin="round" stroke-width=".9" d="M102.5 102a3.5 3.5 0 1 0 7 0 3.5 3.5 0 1 0-7 0M110.5 102a3.5 3.5 0 1 0 7 0 3.5 3.5 0 1 0-7 0M100.5 109a5.5 4 0 0 1 11 0M108.5 109a5.5 4 0 0 1 11 0"/>
  <text x="110" y="122" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Okta /</text>
  <text x="110" y="133" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Azure Entra ID</text>

  <!-- MISP Community (middle-right) -->
  <rect width="110" height="46" x="585" y="93" fill="#eef4fa" stroke="#9aa0a6" stroke-width="1.5" rx="8"/>
  <path stroke="#2d6da3" stroke-linecap="round" stroke-linejoin="round" stroke-width=".9" d="M632.5 102a3.5 3.5 0 1 0 7 0 3.5 3.5 0 1 0-7 0M640.5 102a3.5 3.5 0 1 0 7 0 3.5 3.5 0 1 0-7 0M630.5 109a5.5 4 0 0 1 11 0M638.5 109a5.5 4 0 0 1 11 0"/>
  <text x="640" y="126" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MISP Community</text>

  <!-- Microsoft Sentinel & Other SIEMs (bottom-left) -->
  <rect width="110" height="46" x="55" y="180" fill="#eef4fa" stroke="#9aa0a6" stroke-width="1.5" rx="8"/>
  <path stroke="#2d6da3" stroke-linecap="round" stroke-linejoin="round" stroke-width=".9" d="M102.5 189a3.5 3.5 0 1 0 7 0 3.5 3.5 0 1 0-7 0M110.5 189a3.5 3.5 0 1 0 7 0 3.5 3.5 0 1 0-7 0M100.5 196a5.5 4 0 0 1 11 0M108.5 196a5.5 4 0 0 1 11 0"/>
  <text x="110" y="209" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Microsoft Sentinel</text>
  <text x="110" y="220" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="11" font-weight="700" text-anchor="middle">&amp; Other SIEMs</text>

  <!-- Your Infrastructure (bottom-centre) -->
  <rect width="110" height="46" x="320" y="180" fill="#eef4fa" stroke="#9aa0a6" stroke-width="1.5" rx="8"/>
  <path stroke="#2d6da3" stroke-linecap="round" stroke-linejoin="round" stroke-width=".9" d="M367.5 189a3.5 3.5 0 1 0 7 0 3.5 3.5 0 1 0-7 0M375.5 189a3.5 3.5 0 1 0 7 0 3.5 3.5 0 1 0-7 0M365.5 196a5.5 4 0 0 1 11 0M373.5 196a5.5 4 0 0 1 11 0"/>
  <text x="375" y="213" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Your Infrastructure</text>

  <!-- Threat Intel Feed (bottom-right) -->
  <rect width="110" height="46" x="585" y="180" fill="#eef4fa" stroke="#9aa0a6" stroke-width="1.5" rx="8"/>
  <path stroke="#2d6da3" stroke-linecap="round" stroke-linejoin="round" stroke-width=".9" d="M632.5 189a3.5 3.5 0 1 0 7 0 3.5 3.5 0 1 0-7 0M640.5 189a3.5 3.5 0 1 0 7 0 3.5 3.5 0 1 0-7 0M630.5 196a5.5 4 0 0 1 11 0M638.5 196a5.5 4 0 0 1 11 0"/>
  <text x="640" y="213" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Threat Intel Feed</text>

  <!-- ===== LAYER 3: CONNECTION LABELS ===== -->

  <!-- Label: Intel creation and mgmt -->
  <rect x="383" y="56" width="78" height="26" rx="2" fill="#f8f9fa"/>
  <text x="422" y="68" font-family="Manrope, sans-serif" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Intel creation</text>
  <text x="422" y="79" font-family="Manrope, sans-serif" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">and mgmt</text>

  <!-- Label: Authentication -->
  <rect x="195" y="108" width="84" height="16" rx="2" fill="#f8f9fa"/>
  <text x="237" y="120" font-family="Manrope, sans-serif" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Authentication</text>

  <!-- Label: CTI Sharing -->
  <rect x="480" y="108" width="65" height="16" rx="2" fill="#f8f9fa"/>
  <text x="512" y="120" font-family="Manrope, sans-serif" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">CTI Sharing</text>

  <!-- Label: IOCs and Aging -->
  <rect x="208" y="155" width="58" height="26" rx="2" fill="#f8f9fa"/>
  <text x="237" y="167" font-family="Manrope, sans-serif" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">IOCs and</text>
  <text x="237" y="178" font-family="Manrope, sans-serif" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Aging</text>

  <!-- Label: Feed Ingestion -->
  <rect x="487" y="155" width="50" height="26" rx="2" fill="#f8f9fa"/>
  <text x="512" y="167" font-family="Manrope, sans-serif" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Feed</text>
  <text x="512" y="178" font-family="Manrope, sans-serif" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Ingestion</text>

  <!-- Label: IOCs -->
  <rect x="357" y="154" width="36" height="16" rx="2" fill="#f8f9fa"/>
  <text x="375" y="166" font-family="Manrope, sans-serif" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">IOCs</text>
</svg>
