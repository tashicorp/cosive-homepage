  <text x="578" y="96" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="9" font-weight="500">Multi-org access</text>
  <circle cx="570" cy="109" r="2.5" fill="#2ab6f6"/>
  <text x="578" y="112" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="9" font-weight="500">TAXII server ready</text>
  <circle cx="570" cy="125" r="2.5" fill="#2ab6f6"/>
  <text x="578" y="128" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="9" font-weight="500">Community admin tools</text>
  <circle cx="570" cy="141" r="2.5" fill="#2ab6f6"/>
  <text x="578" y="144" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="9" font-weight="500">Member onboarding</text>

  <!-- Progression labels -->
