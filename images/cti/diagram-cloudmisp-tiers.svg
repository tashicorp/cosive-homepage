<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 750 220">
  <defs>
    <marker id="a" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#e53834" d="m0 1 9 4-9 4z"/></marker>
  </defs>

  <!-- Column headings -->
  <text x="130" y="18" font-family="Manrope, sans-serif" font-size="9" font-weight="700" fill="#5f6368" letter-spacing="0.08em" text-anchor="middle">CORE</text>
