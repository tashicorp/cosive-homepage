  <rect x="460" y="70" width="72" height="16" rx="2" fill="#f8f9fa"/>
  <text x="496" y="82" font-family="Manrope, sans-serif" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">For sharing</text>

  <!-- Bottom description -->
  <text x="375" y="205" font-family="Manrope, sans-serif" font-size="10" fill="#5f6368" font-weight="500" text-anchor="middle">Each tier builds on the previous — choose the level that matches your team's needs</text>
