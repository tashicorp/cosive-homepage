  <path stroke="#e53834" stroke-width="1.5" marker-end="url(#a)" d="M205 80 545 80" stroke-dasharray="4 3" opacity="0.4"/>

  <!-- Arrows: Accelerator -> Share -->
  <path stroke="#e53834" stroke-width="1.5" marker-end="url(#a)" d="M450 80 545 80"/>

