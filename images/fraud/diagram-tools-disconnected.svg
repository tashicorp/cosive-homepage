<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 850 340">
<!-- ===== NODES ===== -->

<!-- Transaction Monitoring (left, top) -->
<rect width="150" height="64" x="180" y="18" fill="#eef4fa" stroke="#9aa0a6" stroke-width="1.5" rx="8"/>
<path stroke="#2d6da3" stroke-linecap="round" stroke-linejoin="round" stroke-width=".9" d="M249 43h13m-11 0v-5m4 5v-10m4 10v-7"/>
<text x="255" y="58" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Transaction</text>
<text x="255" y="70" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Monitoring</text>

<!-- Fraud Database (left, second) -->
<rect width="150" height="64" x="180" y="98" fill="#eef4fa" stroke="#9aa0a6" stroke-width="1.5" rx="8"/>
<ellipse cx="255" cy="116" rx="6" ry="2.5" stroke="#2d6da3" stroke-width=".9" fill="none"/>
<path stroke="#2d6da3" stroke-width=".9" fill="none" d="M249 116v8c0 1.38 2.69 2.5 6 2.5s6-1.12 6-2.5v-8"/>
<text x="255" y="138" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Fraud</text>
<text x="255" y="150" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Database</text>

<!-- Identity & KYC (left, third) -->
<rect width="150" height="64" x="180" y="178" fill="#eef4fa" stroke="#9aa0a6" stroke-width="1.5" rx="8"/>
<path stroke="#2d6da3" stroke-linecap="round" stroke-linejoin="round" stroke-width=".9" fill="none" d="M255 193l-5 2v5c0 3 5 5 5 5s5-2 5-5v-5z"/>
<text x="255" y="218" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Identity</text>
<text x="255" y="230" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="12" font-weight="700" text-anchor="middle">&amp; KYC</text>

<!-- SIEM (left, bottom) -->
<rect width="150" height="64" x="180" y="258" fill="#eef4fa" stroke="#9aa0a6" stroke-width="1.5" rx="8"/>
<path stroke="#2d6da3" stroke-linecap="round" stroke-linejoin="round" stroke-width=".9" fill="none" d="M250 276h10v7h-10zm3-3a2 2 0 014 0v3"/>
<text x="255" y="299" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SIEM</text>

<!-- Fraud Analyst (middle, centred — no box, standalone person icon) -->
<g transform="translate(407, 142) scale(1.5)" stroke="#2d6da3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <circle cx="12" cy="7" r="4"/>
  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
</g>
<text x="425" y="198" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Fraud</text>
<text x="425" y="210" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Analyst</text>

<!-- Case Management (right, centred) -->
<rect width="150" height="64" x="520" y="138" fill="#eef4fa" stroke="#9aa0a6" stroke-width="1.5" rx="8"/>
<path stroke="#2d6da3" stroke-linecap="round" stroke-linejoin="round" stroke-width=".9" fill="none" d="M589 154h12v12h-12zm3 4h6m-6 3h4"/>
<text x="595" y="184" fill="#1a1a1a" font-family="Manrope, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Case Management</text>
</svg>
