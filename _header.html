<style>
  /* Resources dropdown. Lifted from cloudmisp.html's implementation, with three
     values brought to the live cosive.com spec: menu padding Space/XS 0, link
     padding Space/XS Space/MD, link size Text/SM. CSS-only — no JS needed. */
  /* ── Full-size bar sizing ──
     Injected at runtime, so these land after each page's own header CSS and win.
     The bar needed 1528px at its old size, which is wider than most laptops; at
     15px with the shortened CTI label and a 28px logo it needs ~1400px.
     white-space is the safety net: without it a tight fit wraps a label onto two
     lines inside its own item, which is what the collision actually was. */
  .main-nav a,
  .nav-dropdown__toggle {
    font-size: 15px;
    white-space: nowrap;
  }
  .header-logo img { height: 28px; }

  .nav-dropdown { position: relative; }

  .nav-dropdown__toggle {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2xs);
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    color: var(--color-text-secondary);
    font-size: var(--text-base);
    font-weight: 500;
    padding: var(--space-xs) var(--space-md);
    border-radius: var(--radius-sm);
    transition: color 0.2s;
  }

  .nav-dropdown__toggle:hover { color: var(--color-text-primary); }

  .nav-dropdown__toggle svg {
    width: 1em; height: 1em;
    stroke: currentColor; fill: none; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
    transition: transform 0.2s;
  }

  .nav-dropdown:hover .nav-dropdown__toggle svg,
  .nav-dropdown:focus-within .nav-dropdown__toggle svg { transform: rotate(180deg); }

  .main-nav .nav-dropdown__menu {
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 240px;
    flex-direction: column;
    /* .main-nav ul sets align-items:center and also matches this nested ul; on a
       column flex that centres each item horizontally instead of left-aligning. */
    align-items: stretch;
    gap: 0;
    background: var(--color-white);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    box-shadow: 0 8px 30px rgba(14, 20, 28, 0.12);
    padding: var(--space-xs) 0;
    margin-top: var(--space-xs);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-4px);
    transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
    z-index: 101;
  }

  .nav-dropdown:hover .nav-dropdown__menu,
  .nav-dropdown:focus-within .nav-dropdown__menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .main-nav .nav-dropdown__menu a {
    display: block;
    white-space: nowrap;
    padding: var(--space-xs) var(--space-md);
    border-radius: var(--radius-sm);
    color: var(--color-text-secondary);
    font-size: var(--text-sm);
  }

  .main-nav .nav-dropdown__menu a:hover {
    color: var(--color-text-primary);
    background: var(--color-light-grey);
  }

  /* Active page. The rule used to live in about.html and was lost when that page
     was redesigned, so .nav-active was being set on 20 pages with nothing to
     match it. It belongs here now, alongside the markup that carries it. */
  .main-nav a.nav-active,
  .main-nav .nav-dropdown__toggle.nav-active {
    color: var(--color-text-primary);
    font-weight: 600;
  }

  /* ── Capabilities mega-menu ──
     A richer variant of .nav-dropdown whose items carry an icon, title and
     description instead of a bare link. Reuses the same CSS-only
     hover/:focus-within mechanism — only the panel's box and item layout differ.
     One column for now; add `grid-template-columns: 1fr 1fr` and widen when
     there is more than one capability to list. */
  .main-nav .nav-dropdown--mega .nav-dropdown__menu {
    /* Centred on the trigger rather than left-aligned: the panel is much wider
       than the toggle and the nav sits hard against the right gutter, so
       left:0 would push it past the viewport edge. */
    left: 50%;
    right: auto;
    width: 340px;
    max-width: calc(100vw - var(--space-3xl) * 2);
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--space-2xs);
    padding: var(--space-sm);
    transform: translate(-50%, -4px);
  }

  .main-nav .nav-dropdown--mega:hover .nav-dropdown__menu,
  .main-nav .nav-dropdown--mega:focus-within .nav-dropdown__menu {
    transform: translate(-50%, 0);
  }

  .main-nav .nav-dropdown--mega .nav-dropdown__menu a {
    display: flex;
    align-items: flex-start;
    gap: var(--space-sm);
    white-space: normal;
    padding: var(--space-sm);
    border-radius: var(--radius-md);
    height: 100%;
  }

  .nav-mega__icon {
    flex-shrink: 0;
    width: var(--space-lg);
    height: var(--space-lg);
    color: var(--color-accent);
  }

  .nav-mega__icon svg { width: 100%; height: 100%; display: block; }

  .nav-mega__text { display: block; }

  .nav-mega__title {
    display: block;
    font-size: var(--text-base);
    font-weight: 600;
    color: var(--color-text-primary);
    line-height: var(--leading-snug);
  }

  .nav-mega__desc {
    display: block;
    margin-top: var(--space-2xs);
    font-size: var(--text-sm);
    font-weight: 400;
    color: var(--color-text-secondary);
    line-height: var(--leading-snug);
  }

  /* The panel item is the active target, so it gets the highlight rather than
     inheriting the flat .nav-active text treatment above. */
  .main-nav .nav-dropdown--mega .nav-dropdown__menu a.nav-active {
    background: var(--color-light-grey);
    font-weight: 500;
  }

  .main-nav .nav-dropdown--mega .nav-dropdown__menu a.nav-active .nav-mega__title {
    font-weight: 700;
  }

  /* Compression tier. The boundary is the load-bearing number: it must sit ABOVE
     the width at which the full-size bar stops fitting, with margin. It used to
     be 1500px while the bar needed 1528px, which left 1501-1528 uncompressed and
     out of room — the 14" MacBook Pro's 1512px landed in that gap. Measured after
     the resize above, the bar now needs ~1400px, so this boundary keeps ~40px of
     headroom and leaves 1440 on the full-size tier.
     min-width:901px leaves each page's own mobile block below that untouched. */
  @media (max-width: 1430px) and (min-width: 901px) {
    .main-nav ul { gap: var(--space-2xs); }
    .main-nav a,
    .nav-dropdown__toggle {
      padding-left: var(--space-xs);
      padding-right: var(--space-xs);
      font-size: var(--text-sm);
    }
    /* .nav-cta's base declarations are !important, so overrides must be too. */
    .nav-cta {
      padding-left: var(--space-md) !important;
      padding-right: var(--space-md) !important;
      font-size: var(--text-sm) !important;
    }
  }

  /* Last-ditch tier. Widened from 980px: eight items at Text/SM need ~744px of
     text and carets alone, so below ~1150px every remaining pixel has to come
     out of padding and gap. */
  @media (max-width: 1150px) and (min-width: 901px) {
    .main-nav ul { gap: 0; }
    .main-nav a,
    .nav-dropdown__toggle { padding-left: var(--space-2xs); padding-right: var(--space-2xs); }
    .nav-cta { padding-left: var(--space-sm) !important; padding-right: var(--space-sm) !important; }
  }

  @media (max-width: 900px) {
    /* Expand inline within the stacked mobile menu — there is no hover on touch. */
    .nav-dropdown__toggle { width: 100%; justify-content: space-between; padding: var(--space-md) 0; }
    .main-nav .nav-dropdown__menu {
      position: static;
      opacity: 1; visibility: visible; transform: none;
      min-width: 0;
      border: none; border-radius: 0; box-shadow: none;
      padding: 0 0 var(--space-sm) var(--space-md);
      margin: 0;
    }
    .main-nav .nav-dropdown__menu a { padding: var(--space-sm) 0; }
    .nav-dropdown__menu li + li { border-top: none; }

    /* Mega panel collapses to the same stacked list as Resources. */
    .main-nav .nav-dropdown--mega .nav-dropdown__menu {
      position: static;
      display: block;
      width: auto;
      max-width: none;
      transform: none;
      padding: 0 0 var(--space-sm) var(--space-md);
    }
    .main-nav .nav-dropdown--mega:hover .nav-dropdown__menu,
    .main-nav .nav-dropdown--mega:focus-within .nav-dropdown__menu { transform: none; }
    .main-nav .nav-dropdown--mega .nav-dropdown__menu a {
      padding: var(--space-sm) 0;
      align-items: center;
      height: auto;
    }
    /* Four items with descriptions makes the stacked menu unusably tall on a
       phone; the icon and title carry enough meaning on their own. */
    .nav-mega__desc { display: none; }
    .nav-mega__title { font-size: var(--text-sm); font-weight: 500; }
    .main-nav .nav-dropdown--mega .nav-dropdown__menu a.nav-active { background: none; }
  }
</style>
